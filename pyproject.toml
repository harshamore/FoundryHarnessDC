[project]
name = "foundry-harness"
version = "0.1.0"
description = "Agentic security evaluation harness scaffolded from Cisco's open-source Foundry Security Spec"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
]
app = [
    "streamlit>=1.38",
    "openai>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foundry_harness"]
