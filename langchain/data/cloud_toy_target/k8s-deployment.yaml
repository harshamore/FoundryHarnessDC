apiVersion: v1
kind: ServiceAccount
metadata:
  name: process-upload-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: process-upload-binding
roleRef:
  kind: ClusterRole
  name: prod-admin
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: process-upload-sa
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: process-upload
spec:
  replicas: 1
  template:
    spec:
      serviceAccountName: process-upload-sa
      containers:
        - name: process-upload
          image: cloud-toy-target/process-upload:latest
