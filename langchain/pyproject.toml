[project]
name = "foundry-harness"
version = "0.1.0"
description = "Agentic security evaluation harness: DeepAgents runtime + CodeGuard rule corpus, built against Cisco's open-source Foundry Security Spec"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.1",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foundry"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
