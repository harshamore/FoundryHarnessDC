[project]
name = "foundry-harness"
version = "0.1.0"
description = "Agentic security evaluation harness: DeepAgents runtime + CodeGuard rule corpus, built against Cisco's open-source Foundry Security Spec"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.1",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "tree-sitter>=0.24",
    "tree-sitter-language-pack>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]
observability = [
    "galileo>=2.6,<3",
]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
]
cloud = [
    # Pinned below 5.0: versions 5.x-8.x wrap every scalar value in extra
    # escaped quote characters and add an internal `__is_block__` marker
    # to every block dict (verified directly, not assumed) -- a real
    # behavior change, not a docs gap, that would corrupt every attribute
    # value this package reads. 4.3.x's plain-dict output is what every
    # parser in src/foundry/cloud/ is written against.
    "python-hcl2>=4.3,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foundry"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
